<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account · Resume Pilot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif">
  <aside style="flex: 1 1 460px; background: {{t.hero}}; color: #F2F5F9; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; position: relative; overflow: hidden">
    <svg width="100%" height="100%" viewBox="0 0 640 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
      <defs><pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"></path></pattern></defs>
      <rect width="640" height="1000" fill="url(#g3)"></rect>
    </svg>
    <a href="Landing.dc.html" aria-label="Resume Pilot home" style="position: relative; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F2F5F9">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#FF9900"></rect><path d="M6.5 14.8 21 8l-4.6 13.2-2.7-4.9-7.2-1.5Z" fill="#0F1B2A"></path></svg>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 700">Resume<span style="color: #FF9900">Pilot</span></span>
    </a>
    <div style="position: relative; display: flex; flex-direction: column; gap: 28px; max-width: 460px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: clamp(32px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.02em">Plot your first route in minutes.</h1>
      <div style="display: flex; flex-direction: column; gap: 0">
        <sc-for list="{{stops}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 16px">
          <div style="display: flex; flex-direction: column; align-items: center">
            <span style="width: 30px; height: 30px; flex: none; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font: 600 12px 'JetBrains Mono', monospace">{{s.n}}</span>
            <span style="flex: 1; min-height: 22px; border-left: 2px dashed {{s.line}}"></span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 18px">
            <strong style="font-size: 16px">{{s.title}}</strong>
            <span style="font-size: 14px; color: #A9B8C9">{{s.body}}</span>
          </div>
        </div>
        </sc-for>
      </div>
    </div>
    <span style="position: relative; font-size: 13px; color: #8FA1B5">© 2026 Resume Pilot</span>
  </aside>

  <main style="flex: 1 1 520px; display: flex; align-items: center; justify-content: center; padding: 48px 24px">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; letter-spacing: -0.01em">Create your account</h2>
        <span style="font-size: 15px; color: {{t.text2}}">Already have one? <a href="SignIn.dc.html" style="color: {{t.link}}; font-weight: 600">Sign in</a></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px">
        <button type="button" style="font: 600 15px Inter, sans-serif; height: 48px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 12h6" stroke="currentColor" stroke-width="2"></path></svg>Google
        </button>
        <button type="button" style="font: 600 15px Inter, sans-serif; height: 48px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>LinkedIn
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{t.text2}}"><span style="flex: 1; height: 1px; background: {{t.border}}"></span>or with email<span style="flex: 1; height: 1px; background: {{t.border}}"></span></div>
      <form style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Full name
          <input type="text" autocomplete="name" style="font: 400 15px Inter, sans-serif; height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.inputBg}}; color: {{t.text}}">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Email
          <input type="email" autocomplete="email" placeholder="you@example.com" style="font: 400 15px Inter, sans-serif; height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.inputBg}}; color: {{t.text}}">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Password
          <input type="password" autocomplete="new-password" style="font: 400 15px Inter, sans-serif; height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.inputBg}}; color: {{t.text}}">
          <span style="font-size: 13px; font-weight: 400; color: {{t.text2}}">At least 8 characters</span>
        </label>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 10px; border: 1px dashed {{t.accentLine}}; background: {{t.accentTint}}">
          <label for="su-code" style="font-size: 14px; font-weight: 600">Coupon or referral code <span style="font-weight: 400; color: {{t.text2}}">(optional)</span></label>
          <input id="su-code" type="text" placeholder="EARLYBIRD" style="font: 600 15px 'JetBrains Mono', monospace; letter-spacing: 0.06em; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.inputBg}}; color: {{t.text}}">
          <span style="font-size: 13px; color: {{t.text2}}">Get 500 free credits. One code per account.</span>
        </div>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5">
          <input type="checkbox" style="width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: {{t.link}}">
          <span>I agree to the <a href="Legal.dc.html" style="color: {{t.link}}">Terms</a> and <a href="Legal.dc.html" style="color: {{t.link}}">Privacy policy</a>, and consent to my resume being processed to provide the service.</span>
        </label>
        <a href="Welcome.dc.html" style="text-decoration: none; height: 48px; border-radius: 6px; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Create account</a>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? {
      bg: '#0A1119', surface: '#111B27', inputBg: '#0D1620', border: '#26364A', borderStrong: '#4A5F78', text: '#E8EEF5', text2: '#A3B3C5', accent: '#FF9F1C', onAccent: '#0A1119', accentTint: '#2E2210', accentLine: '#C9801C', link: '#5AABFF', hero: '#060B12'
    } : {
      bg: '#F4F6F8', surface: '#FFFFFF', inputBg: '#FFFFFF', border: '#D6DDE6', borderStrong: '#9AA8B8', text: '#0F1B2A', text2: '#4B5A6B', accent: '#FF9900', onAccent: '#0F1B2A', accentTint: '#FFF4E2', accentLine: '#C77700', link: '#0A6BCB', hero: '#0F1B2A'
    };
    const raw = [
      ['Create your account', 'Free. Your wallet starts at 0 credits.'],
      ['Apply a code', 'EARLYBIRD or a friend’s referral adds 500 credits.'],
      ['Upload your resume', 'PDF, DOCX, LaTeX or a photo. Always free.'],
      ['Tailor it to a job', 'See the cost first, pay only what’s used.']
    ];
    const stops = raw.map(([title, body], i) => ({
      n: String(i + 1), title, body,
      bg: i === 0 ? '#FF9900' : '#1B2A3D', fg: i === 0 ? '#0F1B2A' : '#F2F5F9',
      line: i === raw.length - 1 ? 'transparent' : '#4A5F78'
    }));
    return { dark, t, stops };
  }
}
</script>
</body>
</html>
