<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Resume Pilot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif">
  <aside style="flex: 1 1 460px; background: {{t.hero}}; color: #F2F5F9; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; position: relative; overflow: hidden">
    <svg width="100%" height="100%" viewBox="0 0 640 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
      <defs><pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"></path></pattern></defs>
      <rect width="640" height="900" fill="url(#g2)"></rect>
      <path d="M40 760 C 200 760, 240 520, 380 520 S 560 330, 600 260" fill="none" stroke="#FF9900" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 10"></path>
      <circle cx="40" cy="760" r="6" fill="#FF9900"></circle><circle cx="380" cy="520" r="5" fill="#FF9900" fill-opacity="0.7"></circle><circle cx="600" cy="260" r="6" fill="none" stroke="#FF9900" stroke-width="2"></circle>
    </svg>
    <a href="Landing.dc.html" aria-label="Resume Pilot home" style="position: relative; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F2F5F9">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#FF9900"></rect><path d="M6.5 14.8 21 8l-4.6 13.2-2.7-4.9-7.2-1.5Z" fill="#0F1B2A"></path></svg>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 700">Resume<span style="color: #FF9900">Pilot</span></span>
    </a>
    <div style="position: relative; display: flex; flex-direction: column; gap: 18px; max-width: 460px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: clamp(32px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.02em">Pick up right where you left off.</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #C3CFDC">Your resumes, tailored versions, scores and credits are waiting.</p>
    </div>
    <span style="position: relative; font-size: 13px; color: #8FA1B5">© 2026 Resume Pilot</span>
  </aside>

  <main style="flex: 1 1 520px; display: flex; align-items: center; justify-content: center; padding: 48px 24px">
    <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; letter-spacing: -0.01em">Sign in</h2>
        <span style="font-size: 15px; color: {{t.text2}}">New to Resume Pilot? <a href="SignUp.dc.html" style="color: {{t.link}}; font-weight: 600">Create an account</a></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <button type="button" style="font: 600 15px Inter, sans-serif; height: 48px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 12h6" stroke="currentColor" stroke-width="2"></path></svg>Continue with Google
        </button>
        <button type="button" style="font: 600 15px Inter, sans-serif; height: 48px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Continue with LinkedIn
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{t.text2}}"><span style="flex: 1; height: 1px; background: {{t.border}}"></span>or with email<span style="flex: 1; height: 1px; background: {{t.border}}"></span></div>
      <form style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Email
          <input type="email" autocomplete="email" placeholder="you@example.com" style="font: 400 15px Inter, sans-serif; height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.inputBg}}; color: {{t.text}}">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
          <span style="display: flex; justify-content: space-between">Password<a href="#" style="font-weight: 500; color: {{t.link}}">Forgot password?</a></span>
          <input type="password" autocomplete="current-password" style="font: 400 15px Inter, sans-serif; height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.borderStrong}}; background: {{t.inputBg}}; color: {{t.text}}">
        </label>
        <a href="Welcome.dc.html" style="text-decoration: none; height: 48px; border-radius: 6px; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Sign in</a>
      </form>
      <span style="font-size: 13px; line-height: 1.5; color: {{t.text2}}">By continuing you agree to our <a href="Legal.dc.html" style="color: {{t.link}}">Terms</a> and <a href="Legal.dc.html" style="color: {{t.link}}">Privacy policy</a>.</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? {
      bg: '#0A1119', surface: '#111B27', inputBg: '#0D1620', border: '#26364A', borderStrong: '#4A5F78', text: '#E8EEF5', text2: '#A3B3C5', accent: '#FF9F1C', onAccent: '#0A1119', link: '#5AABFF', hero: '#060B12'
    } : {
      bg: '#F4F6F8', surface: '#FFFFFF', inputBg: '#FFFFFF', border: '#D6DDE6', borderStrong: '#9AA8B8', text: '#0F1B2A', text2: '#4B5A6B', accent: '#FF9900', onAccent: '#0F1B2A', link: '#0A6BCB', hero: '#0F1B2A'
    };
    return { dark, t };
  }
}
</script>
</body>
</html>
