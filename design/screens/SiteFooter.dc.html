<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<footer style="background: {{bar}}; border-top: 1px solid {{barLine}}; font-family: Inter, system-ui, sans-serif; color: #F2F5F9">
  <div style="max-width: 1280px; margin: 0 auto; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 340px">
        <a href="Landing.dc.html" aria-label="Resume Pilot home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F2F5F9">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#FF9900"></rect><path d="M6.5 14.8 21 8l-4.6 13.2-2.7-4.9-7.2-1.5Z" fill="#0F1B2A"></path></svg>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 19px; font-weight: 700">Resume<span style="color: #FF9900">Pilot</span></span>
        </a>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #A9B8C9">One resume. Every opportunity. Tailored with AI, without inventing a single fact.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 32px 72px">
        <nav aria-label="Product" style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8FA1B5">Product</span>
          <a href="HowItWorks.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">How it works</a>
          <a href="Pricing.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">Pricing</a>
          <a href="FAQ.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">FAQ</a>
        </nav>
        <nav aria-label="Company" style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8FA1B5">Company</span>
          <a href="About.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">About</a>
          <a href="Contact.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">Contact</a>
        </nav>
        <nav aria-label="Legal" style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8FA1B5">Legal</span>
          <a href="Legal.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">Privacy policy</a>
          <a href="Legal.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">Terms and conditions</a>
          <a href="Legal.dc.html" style="font-size: 14px; color: #DCE4EE; text-decoration: none">Refund policy</a>
        </nav>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; border-top: 1px solid {{barLine}}; padding-top: 20px; font-size: 13px; color: #8FA1B5">
      <span>© 2026 Resume Pilot. Prices in INR.</span>
      <span>Payments secured by Razorpay · Support: [SUPPORT EMAIL]</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { bar: dark ? '#060B12' : '#0F1B2A', barLine: dark ? '#1A2636' : '#22344A' };
  }
}
</script>
</body>
</html>
