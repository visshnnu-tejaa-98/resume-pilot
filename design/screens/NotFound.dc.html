<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found · Resume Pilot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif">
  <dc-import name="SiteNav" dark="{{dark}}" active="none" hint-size="100%,72px"></dc-import>

  <section style="max-width: 1080px; margin: 0 auto; padding: 72px 24px 88px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <span style="font: 600 14px 'JetBrains Mono', monospace; color: {{t.accentText}}">ERROR 404 · OFF ROUTE</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: clamp(34px, 5vw, 52px); line-height: 1.05; letter-spacing: -0.025em">This page isn't on the flight plan.</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: {{t.text2}}">The link may be old or mistyped. Let's get you back on course.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
        <a href="Landing.dc.html" style="text-decoration: none; height: 48px; padding: 0 22px; border-radius: 6px; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 700; font-size: 16px; display: flex; align-items: center">Back to home</a>
        <a href="Contact.dc.html" style="text-decoration: none; height: 48px; padding: 0 20px; border-radius: 6px; border: 1px solid {{t.text}}; color: {{t.text}}; font-weight: 600; font-size: 16px; display: flex; align-items: center">Contact support</a>
      </div>
    </div>
    <svg viewBox="0 0 440 280" width="100%" role="img" aria-label="A dashed route that veers off its path">
      <path d="M20 240 C 110 240, 150 150, 230 150" fill="none" stroke="{{t.link}}" stroke-width="3" stroke-dasharray="10 10"></path>
      <path d="M230 150 C 300 150, 330 90, 410 60" fill="none" stroke="{{t.borderStrong}}" stroke-width="2" stroke-dasharray="4 10"></path>
      <path d="M230 150 C 280 170, 300 230, 360 250" fill="none" stroke="{{t.accent}}" stroke-width="3" stroke-dasharray="10 10"></path>
      <circle cx="20" cy="240" r="9" fill="{{t.link}}"></circle>
      <circle cx="410" cy="60" r="10" fill="none" stroke="{{t.borderStrong}}" stroke-width="2.5"></circle>
      <g transform="translate(360 250) rotate(20)"><rect x="-22" y="-22" width="44" height="44" rx="11" fill="{{t.accent}}"></rect><path d="M-11 1.5 11 -9l-7 20-4-7.5-11-2Z" fill="{{t.onAccent}}"></path></g>
      <text x="410" y="96" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="{{t.text2}}">your page</text>
    </svg>
  </section>

  <dc-import name="SiteFooter" dark="{{dark}}" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? {
      bg: '#0A1119', text: '#E8EEF5', text2: '#A3B3C5', borderStrong: '#4A5F78', accent: '#FF9F1C', onAccent: '#0A1119', accentText: '#FFB547', link: '#5AABFF'
    } : {
      bg: '#F4F6F8', text: '#0F1B2A', text2: '#4B5A6B', borderStrong: '#9AA8B8', accent: '#FF9900', onAccent: '#0F1B2A', accentText: '#A85E00', link: '#0A6BCB'
    };
    return { dark, t };
  }
}
</script>
</body>
</html>
