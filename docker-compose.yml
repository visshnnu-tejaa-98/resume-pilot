services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_pilot
    ports:
      - "55432:5432"
    volumes:
      - resume-pilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  resume-pilot-postgres-data:
