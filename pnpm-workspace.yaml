packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Only an opencollective donation message; not needed.
  tesseract.js: false
  esbuild: true
  msgpackr-extract: true
  # Downloads the Chromium build Puppeteer pins (PDF export, m9).
  puppeteer: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - bullmq@6.7.5
  - prettier@3.10.1
  - turbo@2.11.11
  - "@clerk/backend@3.28.0"
  - "@clerk/nextjs@7.9.26"
  - "@clerk/react@6.18.7"
  - "@clerk/shared@4.45.0"

# @napi-rs/canvas comes in through pdfjs-dist's range; pin a release that's
# older than two weeks (1.1.1 was too new when M3-03 was built).
overrides:
  "@napi-rs/canvas": 1.1.0
